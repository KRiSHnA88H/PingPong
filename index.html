
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multiplayer Pong</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
        }

        canvas {
            border: 2px solid white;
            max-width: 95vw;
            height: auto;
        }

        #status {
            color: #8f8;
        }
    </style>
</head>
<body>
    <h1>Multiplayer Pong</h1>
    <p id="status">Connecting to server...</p>
    <p id="scores">Player 1: 0 | Player 2: 0</p>

    <canvas id="canvas" width="500" height="500"></canvas>

    <p id="controls"></p>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");
        const scores = document.getElementById("scores");
        const controls = document.getElementById("controls");

        let player = 0;
        let state = {
            players: 0,
            paddles: [205, 205],
            ball: [250, 250],
            scores: [0, 0]
        };

        const wsProtocol =
            location.protocol === "https:" ? "wss:" : "ws:";

        const ws = new WebSocket(
            `${wsProtocol}//${location.host}/ws`
        );

        ws.onopen = () => {
            status.textContent = "Connected. Waiting for players...";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "full") {
                status.textContent = data.message;
                return;
            }

            if (data.type === "welcome") {
                player = data.player;
                status.textContent =
                    `You are Player ${player}`;
                controls.textContent = player === 1
                    ? "Controls: W = up, S = down"
                    : "Controls: ↑ = up, ↓ = down";
            }

            if (data.type === "state") {
                state = data;
                scores.textContent =
                    `Player 1: ${data.scores[0]} | ` +
                    `Player 2: ${data.scores[1]}`;

                status.textContent = data.players === 2
                    ? `Player ${player} — Match in progress`
                    : "Waiting for opponent...";
            }
        };

        ws.onclose = () => {
            status.textContent = "Disconnected from server.";
        };

        ws.onerror = () => {
            status.textContent = "Connection error.";
        };

        const keys = new Set();

        function sendMovement() {
            if (ws.readyState !== WebSocket.OPEN || !player) {
                return;
            }

            let direction = 0;

            if (player === 1) {
                if (keys.has("w")) direction -= 1;
                if (keys.has("s")) direction += 1;
            } else if (player === 2) {
                if (keys.has("ArrowUp")) direction -= 1;
                if (keys.has("ArrowDown")) direction += 1;
            }

            ws.send(JSON.stringify({
                type: "move",
                direction: Math.sign(direction)
            }));
        }

        window.addEventListener("keydown", (event) => {
            const key = event.key.length === 1
                ? event.key.toLowerCase()
                : event.key;

            if (["ArrowUp", "ArrowDown", " "].includes(key)) {
                event.preventDefault();
            }

            if (["w", "s", "ArrowUp", "ArrowDown"].includes(key)) {
                keys.add(key);
                sendMovement();
            }
        });

        window.addEventListener("keyup", (event) => {
            const key = event.key.length === 1
                ? event.key.toLowerCase()
                : event.key;

            keys.delete(key);
            sendMovement();
        });

        window.addEventListener("blur", () => {
            keys.clear();
            sendMovement();
        });

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, 500, 500);

            // Center line.
            ctx.strokeStyle = "#555";
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(250, 0);
            ctx.lineTo(250, 500);
            ctx.stroke();
            ctx.setLineDash([]);

            // Player paddles.
            ctx.fillStyle = "#fff";
            ctx.fillRect(20, state.paddles[0], 12, 90);
            ctx.fillRect(468, state.paddles[1], 12, 90);

            // Server-controlled ball.
            ctx.fillRect(
                state.ball[0],
                state.ball[1],
                12,
                12
            );

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
